# Render Blueprint — deploys the Kural brain (FastAPI API + dashboard + webhooks).
# On Render: New -> Blueprint -> connect this repo -> Apply. Then fill the secret
# env values (the sync:false ones). The app code lives in kural/ (rootDir below).
services:
  - type: web
    name: kural-brain
    runtime: python
    plan: free
    rootDir: kural
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: PLIVO_AUTH_ID
        sync: false
      - key: PLIVO_AUTH_TOKEN
        sync: false
      - key: PLIVO_SRC_NUMBER
        sync: false
